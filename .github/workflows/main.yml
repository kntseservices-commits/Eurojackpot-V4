name: Eurojackpot Feed Check

on:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run Eurojackpot feed builder
        run: python EuroJackpot_EV_Set/build_eurojackpot_feed.py

      - name: Check repository diff
        run: git diff --check
